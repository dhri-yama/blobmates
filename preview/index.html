<!doctype html>
<meta charset="utf-8">
<title>Avatar preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font:14px system-ui;margin:0;padding:24px;background:#f7f3ea;color:#222}
  h1{font-size:32px;margin:0 0 16px}
  h2{margin:32px 0 8px;font-size:20px}
  .grid{display:flex;flex-wrap:wrap;gap:14px}
  figure{margin:0;text-align:center;font-size:11px;width:96px}
  figure svg{width:96px;height:96px;display:block}
  #hero{display:flex;gap:24px;align-items:center}
  #hero svg{width:220px;height:220px}
  input{padding:6px 10px;font:inherit}
</style>
<h1>Avatar preview</h1>
<div id="hero"><div id="heroSvg"></div><div>
  <input id="seed" value="sagar" placeholder="seed"> <br><br>
  <div id="moods" class="grid"></div>
  <p>Move the mouse: eyes follow. Blinks are random.</p></div></div>
<h2>Bodies (neutral, blob-face)</h2><div class="grid" id="bodies"></div>
<h2>Moods (same seed)</h2><div class="grid" id="moodGrid"></div>
<h2>Styles (same seed)</h2><div class="grid" id="styles"></div>
<h2>60 random seeds (circle crop)</h2><div class="grid" id="seeds"></div>
<script type="module">
import { makeAvatar } from '../packages/js/src/index.js';
const P = await (await fetch('../assets/parts.json')).json();
const avatar = makeAvatar(P);
const $ = (id) => document.getElementById(id);
const fig = (svg, label) => `<figure>${svg}${label}</figure>`;

// Contact sheets
const seedFor = (i) => 'seed-' + i;
$('bodies').innerHTML = P.bodies.map((b, i) =>
  fig(avatar(seedFor(i), { body: b.id, style: b.block ? 'block-eyes' : 'blob-face', size: 96 }), b.id)).join('');
const moodList = Object.keys(P.moods);
const draw = () => {
  const s = $('seed').value || 'x';
  $('moodGrid').innerHTML = moodList.map((m) => fig(avatar(s, { mood: m, size: 96 }), m)).join('');
  $('styles').innerHTML = Object.keys(P.styles).map((st) => fig(avatar(s, { style: st, size: 96 }), st)).join('');
};
draw(); $('seed').addEventListener('input', draw);
$('seeds').innerHTML = Array.from({ length: 60 }, (_, i) => fig(avatar('user' + i, { shape: 'circle', size: 96 }), 'user' + i)).join('');

// Hero: live mood + gaze + blink
let mood = 'neutral', gaze = [0, 0], blink = 0;
$('moods').innerHTML = moodList.map((m) => `<button data-m="${m}">${m}</button>`).join('');
$('moods').onclick = (e) => { if (e.target.dataset.m) { mood = e.target.dataset.m; render(); } };
const render = () => { $('heroSvg').innerHTML = avatar($('seed').value || 'x', { mood, gaze: gaze[0] === 0 && gaze[1] === 0 ? undefined : gaze, blink, size: 220 }); };
addEventListener('mousemove', (e) => {
  const r = $('heroSvg').getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, d / 200); gaze = [(dx / d) * k, (dy / d) * k]; render();
});
$('seed').addEventListener('input', render);
(function loop() { setTimeout(() => { blink = 1; render(); setTimeout(() => { blink = 0; render(); loop(); }, 110); }, 2000 + Math.random() * 3500); })();
render();
</script>
